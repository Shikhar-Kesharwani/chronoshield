version: '3.8'
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    networks:
      - app-network
    healthcheck:
      test: ['CMD','curl','-f','http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
networks:
  app-network:
    driver: bridge

version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: ts_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ts_timescaledb
    environment:
      POSTGRES_DB: anomaly_detection
      POSTGRES_USER: tsuser
      POSTGRES_PASSWORD: tspassword
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsuser -d anomaly_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  timescale_data:
